name: Build and deploy reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out visualizer
        uses: actions/checkout@v5

      - name: Read ComfyUI pin
        id: comfy
        run: echo "sha=$(tr -d '\r\n' < COMFYUI_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned ComfyUI
        uses: actions/checkout@v5
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ steps.comfy.outputs.sha }}
          path: _comfy
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Check frontend syntax
        run: node --check app.js

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate reference
        run: python generate.py --comfy-source _comfy

      - name: Run focused tests
        run: python -m unittest -v test_reference.py

      - name: Verify generated data is current
        run: git diff --exit-code -- data

      - name: Verify generated assets
        run: python -c "from pathlib import Path; files=[p for p in Path('assets').rglob('*') if p.is_file()]; assert len(files) == 240, len(files); assert all(p.stat().st_size > 0 for p in files)"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp index.html styles.css app.js generate.py COMFYUI_COMMIT LICENSE .nojekyll _site/
          cp -r assets data _site/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
